name: Verify canonical JavaFX migration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: normlanguage/registry/.github/actions/setup-norm@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          version: 0.27.23
      - run: norm run samples/migration
